    <p class="peek-intro">Answer 9 questions to find out!</p>

    <!-- The script below puts the questions (and your answer) in here -->

  </section>

  <!-- BOTTOM BAR -->
  <footer>
    <p class="footer-links"><a href="news.html">News</a> · <a href="faq.html">FAQ</a> · <a href="tips.html">Flying Tips</a> · <a href="comic-maker.html">Comic Maker</a></p>

  </footer>

  <!-- JAVASCRIPT: the quiz -->
  <script>
    // ----- THE CHARACTERS -----
    // pic = where to cut them out of a cover (same numbers as characters.html)
    const CHARACTERS = {
      barry: {
        name: "Barry", comic: "Not Smart Cops", peek: "cops",
        pic: "--img: url(not-smart-cops.png); --x: 215; --y: 845; --w: 230; --h: 635;",
        alt: "Barry, a tall police officer with a mustache",
        text: "You're super confident and you always have a plan. It doesn't always WORK, but you always have one! Just watch out for mosquitoes."
      },
      lou: {
        name: "Lou", comic: "Not Smart Cops", peek: "cops",
        pic: "--img: url(not-smart-cops.png); --x: 590; --y: 960; --w: 330; --h: 520;",
        alt: "Lou, a round police officer",
        text: "You're chill and easygoing. You let other people do the hard stuff, but everyone trusts you with the important things (like the loot bag)."
      },
      antis: {
        name: "PrayingAntis", comic: "PrayingAntis", peek: "antis",
        pic: "--img: url(praying-antis.png); --x: 290; --y: 640; --w: 520; --h: 820;",
        alt: "PrayingAntis, a superhero with a mantis body, an ant head, a blue mask and a red cape",
        text: "You're brave and you love to help people. When there's trouble, you jump right in. Just be careful what you bite!"
      },
      biscuit: {
        name: "Biscuit", comic: "PrayingAntis", peek: "antis",
        pic: "--img: url(peek-antis.png); --x: 415; --y: 425; --w: 100; --h: 80;",
        alt: "Biscuit, a small brown lab dog",
        text: "You love naps, snacks, and chasing things. You seem sleepy, but there's something wild inside you waiting to come out..."
      },
      gus: {
        name: "Gus", comic: "Not Smart Sports: Baseball Edition", peek: "sports",
        pic: "--img: url(not-smart-sports.png); --x: 355; --y: 890; --w: 240; --h: 590;",
        alt: "Gus, a baseball player in a pinstripe uniform",
        text: "You dream BIG and nothing stops you. Not on the team? Doesn't matter. You're going to the World Series anyway!"
      },
      ray: {
        name: "Ray", comic: "Not Smart Sports: Baseball Edition", peek: "sports",
        pic: "--img: url(not-smart-sports.png); --x: 730; --y: 1060; --w: 230; --h: 440;",
        alt: "Ray, a baseball player holding a tray of bagels",
        text: "You're the best friend anyone could have. You're loyal, kind, and you always bring snacks to share."
      },
      max: {
        name: "Max", comic: "The Heroes with Twisted Legs", peek: "heroes",
        pic: "--img: url(new-characters.png); --x: 90; --y: 10; --w: 186; --h: 420;",
        alt: "Max, a boy with spiky brown hair and a green hoodie",
        text: "You're a little clumsy, but you're SO much fun. Things go wrong around you... and somehow they always turn out great!"
      },
      toby: {
        name: "Toby", comic: "The Heroes with Twisted Legs", peek: "heroes",
        pic: "--img: url(new-characters.png); --x: 460; --y: 40; --w: 180; --h: 400;",
        alt: "Toby, a boy with glasses and a red striped shirt",
        text: "You're full of ideas! Not all of them work (remember the butter?), but you never stop trying. And you never leave your friends behind."
      },
      blackout: {
        name: "Dr. Blackout", comic: "The Heroes with Twisted Legs", peek: "heroes",
        pic: "--img: url(new-characters.png); --x: 795; --y: 20; --w: 240; --h: 410;",
        alt: "Dr. Blackout, a villain with a monocle, a mustache and a purple cape",
        text: "You're a big thinker with BIG plans. Maybe a little too big. Try using your genius for good instead of turning off the whole world!"
      },
      pooant: {
        name: "Pooant", comic: "Praying Antis 2", peek: "antis2",
        pic: "--img: url(new-characters.png); --x: 20; --y: 485; --w: 320; --h: 400;",
        alt: "Pooant, an ant with a yellow cape holding a poo blaster",
        text: "You're brave, you're funny, and you'll help anyone, even a hero who turned evil. Your methods are a little... smelly. But they WORK."
      },
      vonbolt: {
        name: "Baron Von Bolt", comic: "Praying Antis 2", peek: "antis2",
        pic: "--img: url(new-characters.png); --x: 410; --y: 455; --w: 280; --h: 430;",
        alt: "Baron Von Bolt, a villain with goggles, a jetpack and a laser arm",
        text: "You love gadgets and you always turn things up to MAXIMUM. You have the best evil laugh around. MWAHAHAHA!"
      },
      bot: {
        name: "Battle Bot", comic: "Praying Antis 2", peek: "antis2",
        pic: "--img: url(new-characters.png); --x: 750; --y: 495; --w: 330; --h: 385;",
        alt: "Battle Bot, a big red robot with treads, a drill and a claw",
        text: "You're strong, you're tough, and you never give up. You'd rather DO stuff than talk about it. Beep boop!"
      }
    };

    // ----- THE QUESTIONS -----
    // Each answer gives a point to one character. Most points wins!
    const QUESTIONS = [
      { q: "What's your favorite snack?", answers: [
        ["🥯 Bagels", "ray"], ["🍩 Donuts", "lou"], ["🦴 Dog treats", "biscuit"], ["🌶️ Super spicy chips", "antis"], ["🍌 Bananas (I slip on the peels)", "max"] ] },
      { q: "What do you do on a Saturday?", answers: [
        ["⚾ Play baseball", "gus"], ["😴 Take a big nap", "biscuit"], ["🦸 Save the day", "antis"], ["📣 Tell everyone how great I am", "barry"], ["🔧 Build an evil invention", "vonbolt"] ] },
      { q: "Your friends say you're...", answers: [
        ["🤝 Loyal", "ray"], ["😎 Confident (maybe TOO confident)", "barry"], ["💪 Determined", "gus"], ["🛋️ Super chill", "lou"], ["😂 Hilarious", "pooant"] ] },
      { q: "A mosquito lands on you. What do you do?", answers: [
        ["👋 Swat it... and miss", "barry"], ["🙋 Make my partner deal with it", "lou"], ["🔥 Bite it. It catches fire.", "antis"], ["🐕 Chase it around the room", "biscuit"], ["🤓 Study it through my glasses", "toby"] ] },
      { q: "What's your biggest dream?", answers: [
        ["🏆 Win the World Series", "gus"], ["🥯 Share bagels with the whole world", "ray"], ["💰 Be in charge of the loot bag", "lou"], ["🌆 Be the city's greatest hero", "antis"], ["💵 Have a TRILLION dollars", "blackout"] ] },
      { q: "Pick a superpower:", answers: [
        ["🥸 The most perfect mustache ever", "barry"], ["☢️ A glowing toxic eye", "biscuit"], ["💥 A mega home-run swing", "gus"], ["🙏 Getting anything just by asking nicely", "ray"], ["🦾 Being made of solid metal", "bot"] ] },
      { q: "Uh oh, the power goes out! What do you do?", answers: [
        ["🔦 Trip over everything in the dark", "max"], ["🧈 Come up with an idea (probably a bad one)", "toby"],
        ["😈 Laugh. I did it on purpose.", "blackout"], ["🤖 Turn on my glowing robot eyes", "bot"] ] },
      { q: "Pick a cool gadget:", answers: [
        ["💩 A poo blaster", "pooant"], ["🚀 A jetpack", "vonbolt"],
        ["⚡ A machine that controls the world's power", "blackout"], ["🛠️ A giant drill arm", "bot"] ] },
      { q: "How do you get around?", answers: [
        ["🦵 Hopping, with my best friend", "toby"], ["🤸 Falling. A LOT.", "max"],
        ["🦸 Running, with my cape flapping", "pooant"], ["🔥 Flying (until my jetpack catches fire)", "vonbolt"] ] }
    ];

    const quiz = document.getElementById("quiz");
    let step = 0;        // which question we're on
    let points = {};     // how many points each character has
    let lastPick = "";   // if there's a tie, the last answer you picked wins

    function start() {
      step = 0;
      points = {};
      lastPick = "";
      showQuestion();
    }

    function showQuestion() {
      const item = QUESTIONS[step];
      quiz.innerHTML = "";

      const progress = document.createElement("p");
      progress.className = "quiz-progress";
      progress.textContent = "Question " + (step + 1) + " of " + QUESTIONS.length;
      const bar = document.createElement("div");
      bar.className = "quiz-bar";
      const fill = document.createElement("div");
      fill.style.width = (step / QUESTIONS.length * 100) + "%";
      bar.appendChild(fill);

      const question = document.createElement("h3");
      question.textContent = item.q;

      const answers = document.createElement("div");
      answers.className = "quiz-answers";
      item.answers.forEach(function (a) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "quiz-answer";
        b.textContent = a[0];
        b.addEventListener("click", function () { pick(a[1]); });
        answers.appendChild(b);
      });

      quiz.append(progress, bar, question, answers);
      answers.querySelector("button").focus({ preventScroll: true });
    }

    function pick(who) {
      points[who] = (points[who] || 0) + 1;
      lastPick = who;
      step++;
      if (step < QUESTIONS.length) showQuestion();
      else showResult();
    }

    function showResult() {
      // Find the character with the most points (ties go to your last answer)
      let winner = lastPick;
      Object.keys(points).forEach(function (who) {
        if (points[who] > points[winner]) winner = who;
      });
      const c = CHARACTERS[winner];

      quiz.innerHTML = "";
      const box = document.createElement("div");
      box.className = "quiz-result";

      const label = document.createElement("p");
      label.className = "quiz-progress";
      label.textContent = "You are...";
      const pic = document.createElement("div");
      pic.className = "char-pic";
      pic.setAttribute("role", "img");
      pic.setAttribute("aria-label", c.alt);
      pic.setAttribute("style", c.pic);
      const name = document.createElement("h3");
      name.textContent = c.name + "!";
      const from = document.createElement("p");
      from.className = "char-role";
      from.textContent = "From " + c.comic;
      const text = document.createElement("p");
      text.textContent = c.text;

      const buttons = document.createElement("div");
      buttons.className = "quiz-buttons";
      const read = document.createElement("a");
      read.className = "button";
      read.href = "sneak-peeks.html#" + c.peek;
      read.textContent = "Read about " + c.name;
      const again = document.createElement("button");
      again.type = "button";
      again.className = "quiz-again";
      again.textContent = "🔄 Take it again";
      again.addEventListener("click", start);
      buttons.append(read, again);

      box.append(label, pic, name, from, text, buttons);
      quiz.appendChild(box);
    }

    start();
  </script>

</body>
